services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: data-lake-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:${KAFKA_EXTERNAL_PORT:-9092},INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: data-lake-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-data-lake}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        touch /tmp/.keep
        mc cp /tmp/.keep "local/$$MINIO_BUCKET/raw/.keep"
        mc cp /tmp/.keep "local/$$MINIO_BUCKET/silver/.keep"
        mc cp /tmp/.keep "local/$$MINIO_BUCKET/gold/.keep"
        mc cp /tmp/.keep "local/$$MINIO_BUCKET/rejected/.keep"

  spark-master:
    image: spark:3.5.8
    container_name: data-lake-spark-master
    command:
      - /bin/bash
      - -lc
      - /opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    image: spark:3.5.8
    container_name: data-lake-spark-worker
    command:
      - /bin/bash
      - -lc
      - /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2G}"
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"

  spark-pipeline:
    profiles: [m3]
    build:
      context: .
      dockerfile: docker/spark-pipeline.Dockerfile
    image: data-lake-spark-pipeline:3.5.8
    user: "0:0"
    working_dir: /workspace
    environment:
      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: "${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}"
      KAFKA_RAW_TOPIC: "${KAFKA_RAW_TOPIC:-raw-events}"
      PYTHONPATH: /workspace
      TZ: UTC
    volumes:
      - ./streaming:/workspace/streaming:ro
      - ./config:/workspace/config:ro
      - ./tests:/workspace/tests:ro
      - ./data/m3:/workspace/data/m3
      - ./checkpoints/spark:/workspace/checkpoints/spark
      - ./logs/m3:/workspace/logs/m3
      - spark-ivy:/root/.ivy2
    entrypoint: ["/opt/spark/bin/spark-submit"]

  spark-lake:
    profiles: [m4]
    build:
      context: .
      dockerfile: docker/spark-lake.Dockerfile
    image: data-lake-spark-lake:3.5.8
    user: "0:0"
    working_dir: /workspace
    environment:
      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: "${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}"
      KAFKA_RAW_TOPIC: "${KAFKA_RAW_TOPIC:-raw-events}"
      MINIO_ENDPOINT: "${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-data-lake}"
      AWS_REGION: "${AWS_REGION:-us-west-2}"
      PYTHONPATH: /workspace
      TZ: UTC
    volumes:
      - ./lake:/workspace/lake:ro
      - ./streaming:/workspace/streaming:ro
      - ./config:/workspace/config:ro
      - ./checkpoints/lake:/workspace/checkpoints/lake
      - ./logs/m4:/workspace/logs/m4
      - spark-ivy:/root/.ivy2
    entrypoint: ["/opt/spark/bin/spark-submit"]

volumes:
  kafka-data:
  minio-data:
  spark-ivy:
